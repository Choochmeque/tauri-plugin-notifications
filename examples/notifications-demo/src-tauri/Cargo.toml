[package]
name = "notifications-demo"
version = "0.1.0"
description = "Demo app for tauri-plugin-notifications"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notifications_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Default is the native backend (WinRT on Windows, UserNotifications on macOS).
default = []
# Selects the notify-rust backend instead:
#
#     pnpm tauri dev --features notify-rust
#
# Useful because the native macOS/Windows backends need bundle identity, which a
# dev binary run out of `target/debug` doesn't have — on macOS the plugin refuses
# to initialise at all ("requires the app to run from a .app bundle"). Use
# `tauri build` to exercise the native backends.
notify-rust = ["tauri-plugin-notifications/notify-rust"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notifications = { path = "../../../", default-features = false, features = [
    "push-notifications",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Logging output
env_logger = { version = "0.11", default-features = false, features = [
    "humantime",
] }
