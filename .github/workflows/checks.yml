name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Superseded runs cancel per workflow+ref (PR merge refs and branch pushes
  # alike); main is pinned to a unique group (run_id) so every commit on main
  # gets its own uncancellable verification run.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts of the tree does this PR touch? Push events (main only) skip
  # gating entirely; anything unmapped ("other") turns every job on.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      js: ${{ steps.f.outputs.js }}
      android: ${{ steps.f.outputs.android }}
      ios: ${{ steps.f.outputs.ios }}
      macos: ${{ steps.f.outputs.macos }}
      all: ${{ github.event_name != 'pull_request' || steps.f.outputs.other == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            rust:
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'permissions/**'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'examples/*/src-tauri/**'
            js:
              - 'guest-js/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'rollup.config.js'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'examples/*/src/**'
              - 'examples/*/package.json'
              - 'examples/*/pnpm-lock.yaml'
            android:
              - 'android/**'
              - 'examples/*/src-tauri/gen/android/**'
            ios:
              - 'ios/**'
              - 'examples/*/src-tauri/gen/apple/**'
            macos:
              - 'macos/**'
            other:
              - '**'
              - '!tsconfig*.json'
              - '!rust-toolchain*'
              - '!src/**'
              - '!build.rs'
              - '!Cargo.toml'
              - '!Cargo.lock'
              - '!deny.toml'
              - '!permissions/**'
              - '!.cargo/**'
              - '!guest-js/**'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!rollup.config.js'
              - '!vitest.config.ts'
              - '!android/**'
              - '!ios/**'
              - '!macos/**'
              - '!examples/**'
              - '!README.md'
              - '!LICENSE'
  # Code formatting.
  fmt:
    needs: changes
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' }}
    name: cargo-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  prettier:
    # format:check sweeps JSON/HTML/CSS across the whole tree (including files in
    # rust- and android-mapped areas), and the job costs seconds — always runs.
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run format:check

  # Static analyzer.
  #
  # The `notify-rust` feature selects the implementation module rather than
  # adding to it: with it on, `desktop.rs` is compiled; with it off,
  # `macos.rs` / `windows.rs` are. So a single `--all-features` pass can never
  # lint the native backends — every desktop OS needs both feature sets.
  # Linux has no native backend (`desktop.rs` is compiled either way), so the
  # `native` rows there only assert the crate still builds with the feature off.
  clippy:
    needs: changes
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' }}
    name: cargo-clippy (${{ matrix.os }}, ${{ matrix.backend.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend:
          - name: notify-rust
            flags: ""
          - name: notify-rust+push
            flags: "--features push-notifications"
          - name: native
            flags: "--no-default-features"
          - name: native+push
            flags: "--no-default-features --features push-notifications"
    steps:
      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf llvm-dev clang cmake grcov
          version: "1.0"  # bump this to invalidate the cache when needed

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets ${{ matrix.backend.flags }} -- -D warnings -D clippy::unwrap_used

  # Static analyzer for mobile targets.
  clippy-mobile:
    needs: changes
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' }}
    name: cargo-clippy (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo clippy --lib --target ${{ matrix.target }} --all-features -- -D warnings -D clippy::unwrap_used

  # cargo-deny.
  deny:
    needs: changes
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' }}
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # cargo-semver.
  semver:
    needs: changes
    if: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' }}
    name: cargo-semver
    runs-on: ubuntu-latest
    steps:
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf llvm-dev clang cmake grcov
          version: "1.0"  # bump this to invalidate the cache when needed

      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2

